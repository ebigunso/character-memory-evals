run_id = "continuity_situated"
dataset = "continuity"

[backend]

[backend.embedding]
provider = "controllable_similarity"
model = "deterministic"
vector_size = 32

[retrieval]
mode = "hybrid"

[retrieval.surface_policy]
object_types = ["episode", "observation", "derived_memory", "memory_thread", "entity"]
include_debug_rationale = true
max_vector_candidates = 48
max_graph_roots = 48

[retrieval.surface_policy.sections]
active_threads = 6
relevant_episodes = 8
salient_observations = 8
derived_memories = 12
preferences = 8
relationship_notes = 8
open_loops = 8
commitments = 8
character_signals = 8
