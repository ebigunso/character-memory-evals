run_id = "t9bcb"
dataset = "continuity"

[backend]
namespace_prefix = "cmem_eval_t9bcb"
qdrant_connection_string = "http://127.0.0.1:6334"
oxigraph_persistence_path = "runs/continuity/v0-1-5-task9b/canonical-b/stores/oxigraph"
retrieval_stats_path = "runs/continuity/v0-1-5-task9b/canonical-b/stores/retrieval.sqlite"
identity_registry_dir = "runs/continuity/v0-1-5-task9b/canonical-b/stores/identities"

[backend.character_memory]
selectivity_smoothing_alpha = 1.0
selectivity_gamma = 1.0

[backend.character_memory.retrieval.fanout.about_entity.derived_memory]
min = 0
max = 20

[backend.character_memory.retrieval.fanout.participant_entity.episode]
min = 0
max = 5

[backend.character_memory.retrieval.fanout.part_of_thread.derived_memory]
min = 0
max = 15

[backend.cleanup]
enabled = false
require_collection_prefix = "cmem_eval_t9bcb"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"
vector_size = 3072
store_path = "crates/cmem-eval-continuity/fixtures/embeddings/task22_real_store.json"

[retrieval]
mode = "hybrid"

[retrieval.surface_policy]
object_types = ["episode", "observation", "derived_memory", "memory_thread", "entity"]
include_debug_rationale = true
max_vector_candidates = 48
max_graph_roots = 12

[retrieval.surface_policy.sections]
active_threads = 6
relevant_episodes = 8
salient_observations = 8
derived_memories = 12
preferences = 8
relationship_notes = 8
open_loops = 8
commitments = 8
character_signals = 8

[ingest]
index_observations = true
index_episode_summaries = true
