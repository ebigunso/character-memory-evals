run_id = "longmemeval_s_v0_1_hybrid"
dataset = "longmemeval_s"

[backend]
namespace_prefix = "bench:lme"
reset_namespace_before_each_question = true

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:lme"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
top_k_episodes = 10
top_k_observations = 50
include_derived_memories = true
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
create_threads = false
store_gold_labels = false
# Optional precomputed enrichment JSONL produced from haystack/source text only.
enrichment_path = "./datasets/enriched/longmemeval_s_enrichment.jsonl"

[metrics]
ks_session = [1, 3, 5, 10]
ks_turn = [5, 10, 20, 50]
