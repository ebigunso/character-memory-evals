run_id = "longmemeval_s_v0_1_hybrid"
dataset = "longmemeval_s"

[backend]
namespace_prefix = "bench:lme"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:lme"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
include_derived_memories = true
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
create_threads = false
store_gold_labels = false
# Per-question graph snapshots produced from source-only chronological replay.
enrichment_snapshot_path = "./datasets/enriched/longmemeval_s_online_snapshots.jsonl"
enrichment_manifest_path = "./datasets/enriched/longmemeval_s_online_snapshots_manifest.json"

[metrics]
ks_session = [1, 3, 5, 10]
ks_turn = [5, 10, 20, 50]
