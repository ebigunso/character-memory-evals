run_id = "locomo_v0_1_vector"
dataset = "locomo"

[backend]
namespace_prefix = "bench:locomo_vector"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:locomo_vector"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
mode = "vector_only"
top_k_episodes = 10
top_k_observations = 20
include_derived_memories = false
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
index_session_summaries = false
index_generated_observations = false
include_image_captions = false
store_gold_labels = false

[metrics]
ks_dialog = [5, 10, 20, 50]
ks_session = [1, 3, 5, 10]
