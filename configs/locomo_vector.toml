run_id = "locomo_v0_1_vector"
dataset = "locomo"

[backend]
namespace_prefix = "bench:locomo_vector"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:locomo_vector"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
mode = "vector_only"

[retrieval.surface_policy]
object_types = ["episode", "observation"]
include_debug_rationale = true

[retrieval.surface_policy.sections]
active_threads = 0
relevant_episodes = 10
salient_observations = 20
derived_memories = 0
preferences = 0
relationship_notes = 0
open_loops = 0
commitments = 0
character_signals = 0

[ingest]
index_session_summaries = false
index_generated_observations = false
include_image_captions = false

[metrics]
ks_dialog = [5, 10, 20, 50]
ks_session = [1, 3, 5, 10]
