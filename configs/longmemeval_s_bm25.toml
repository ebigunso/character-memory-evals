run_id = "longmemeval_s_v0_1_bm25"
dataset = "longmemeval_s"

[backend]
namespace_prefix = "bench:lme_bm25"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:lme_bm25"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
mode = "bm25_only"

[retrieval.surface_policy]
object_types = ["episode", "observation"]
include_debug_rationale = true

[retrieval.surface_policy.sections]
active_threads = 0
relevant_episodes = 10
salient_observations = 50
derived_memories = 0
preferences = 0
relationship_notes = 0
open_loops = 0
commitments = 0
character_signals = 0

[ingest]

[metrics]
ks_session = [1, 3, 5, 10]
ks_turn = [5, 10, 20, 50]
