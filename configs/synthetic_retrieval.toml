run_id = "synthetic_smoke"
dataset = "synthetic"

[backend]
namespace_prefix = "bench:synthetic"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:synthetic"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]

[retrieval.surface_policy]
object_types = ["episode", "observation", "derived_memory"]
include_debug_rationale = true

[retrieval.surface_policy.sections]
active_threads = 0
relevant_episodes = 5
salient_observations = 10
derived_memories = 12
preferences = 8
relationship_notes = 8
open_loops = 8
commitments = 8
character_signals = 8

[ingest]
index_observations = true
index_episode_summaries = true
