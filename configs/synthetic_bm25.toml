run_id = "synthetic_bm25"
dataset = "synthetic"

[backend]
namespace_prefix = "bench:synthetic_bm25"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:synthetic_bm25"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
mode = "bm25_only"
top_k_episodes = 5
top_k_observations = 10
include_derived_memories = false
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
