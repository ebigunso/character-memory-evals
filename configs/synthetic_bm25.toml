run_id = "synthetic_bm25"
dataset = "synthetic"

[backend]
namespace_prefix = "bench:synthetic_bm25"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:synthetic_bm25"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
mode = "bm25_only"

[retrieval.surface_policy]
object_types = ["episode", "observation"]
include_debug_rationale = true

[retrieval.surface_policy.sections]
active_threads = 0
relevant_episodes = 5
salient_observations = 10
derived_memories = 0
preferences = 0
relationship_notes = 0
open_loops = 0
commitments = 0
character_signals = 0

[ingest]
index_observations = true
index_episode_summaries = true
