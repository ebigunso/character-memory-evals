run_id = "locomo_v0_1_hybrid"
dataset = "locomo"

[backend]
namespace_prefix = "bench:locomo"
reset_namespace_before_each_sample = true

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:locomo"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
top_k_episodes = 10
top_k_observations = 20
include_derived_memories = true
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
index_session_summaries = true
index_generated_observations = true
include_image_captions = false
store_gold_labels = false
# Optional additional precomputed enrichment JSONL produced from conversation text only.
enrichment_path = "./datasets/enriched/locomo_enrichment.jsonl"

[metrics]
ks_dialog = [5, 10, 20, 50]
ks_session = [1, 3, 5, 10]
