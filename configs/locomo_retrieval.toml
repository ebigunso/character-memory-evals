run_id = "locomo_v0_1_hybrid"
dataset = "locomo"

[backend]
namespace_prefix = "bench:locomo"

[backend.cleanup]
enabled = false
require_collection_prefix = "bench:locomo"

[backend.embedding]
provider = "openai"
model = "text-embedding-3-large"

[retrieval]
include_derived_memories = true
include_threads = false
include_entities = false
include_debug_rationale = true

[ingest]
index_observations = true
index_episode_summaries = true
index_session_summaries = false
index_generated_observations = false
include_image_captions = false
store_gold_labels = false
# Final per-sample graph snapshots produced from source-only chronological replay.
enrichment_snapshot_path = "./datasets/enriched/locomo_online_snapshots.jsonl"
enrichment_manifest_path = "./datasets/enriched/locomo_online_snapshots_manifest.json"

[metrics]
ks_dialog = [5, 10, 20, 50]
ks_session = [1, 3, 5, 10]
