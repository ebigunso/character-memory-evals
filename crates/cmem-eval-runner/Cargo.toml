[package]
name = "cmem-eval-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cmem-eval"
path = "src/main.rs"

[features]
real-character-memory = ["dep:character-memory", "dep:config", "dep:qdrant-client", "dep:reqwest"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
cmem-eval-core = { path = "../cmem-eval-core" }
cmem-eval-longmemeval = { path = "../cmem-eval-longmemeval" }
cmem-eval-locomo = { path = "../cmem-eval-locomo" }
character-memory = { workspace = true, optional = true }
config = { version = "0.15", optional = true }
qdrant-client = { version = "1.17.0", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3"
