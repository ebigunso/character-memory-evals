# A caller keeps rewriting the same account without new evidence. Six changes
# in one minute must warn by the final write; earlier warnings are unasserted.
[[scenarios]]
fixture_id = "c4-churning-account"
namespace = "situated-c4-churn"
pattern = "situated"
catalog_situations = ["C4"]
character_entity = "mara"
entities = [
  {external_id = "mara", label = "Mara", is_hub = false},
  {external_id = "jo", label = "Jo", is_hub = false},
]
[scenarios.embedding]
provider = "controllable_similarity"
own_concept = true
seed = 7
vector_size = 32
noise_magnitude = 0.01
clusters = {}
concepts = {}
[scenarios.scenes.garden]
who = [{reference = {by = "key", key = "mara"}}, {reference = {by = "key", key = "jo"}}]
where = {by = "setting", key = "allotment"}
[[scenarios.events]]
kind = "experience"
event_id = "shared-harvest"
timestamp = "2025-09-01T10:00:00Z"
text = "Jo and I picked the last beans and divided the harvest equally."
scene = {kind = "named", name = "garden"}
[[scenarios.events]]
kind = "derive"
event_id = "account-0"
timestamp = "2025-09-01T10:01:00Z"
memory = {subtype = "reflection", text = "We shared the final bean harvest equally.", experiences = ["shared-harvest"], about = ["mara", "jo"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-1"
timestamp = "2025-09-01T10:01:10Z"
memory = {subtype = "reflection", text = "Jo and I each took half of the last beans.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-0"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-2"
timestamp = "2025-09-01T10:01:20Z"
memory = {subtype = "reflection", text = "Our last picking left equal shares for Jo and me.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-1"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-3"
timestamp = "2025-09-01T10:01:30Z"
memory = {subtype = "reflection", text = "Neither of us took more than the other from the final harvest.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-2"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-4"
timestamp = "2025-09-01T10:01:40Z"
memory = {subtype = "reflection", text = "The remaining beans went half to Jo and half to me.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-3"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-5"
timestamp = "2025-09-01T10:01:50Z"
memory = {subtype = "reflection", text = "We made two equal piles from the last picking.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-4"]}
[[scenarios.events]]
kind = "derive"
event_id = "account-6"
timestamp = "2025-09-01T10:02:00Z"
expected_warning = "churning_chain"
memory = {subtype = "reflection", text = "Jo and I split the season's final beans evenly.", experiences = ["shared-harvest"], about = ["mara", "jo"], supersedes = ["account-5"]}
[[scenarios.events]]
kind = "probe"
event_id = "stable-basis"
query_id = "c4-churn-current"
timestamp = "2025-10-01T10:00:00Z"
scene = {kind = "named", name = "garden"}
[scenarios.events.assertions]
carried = [{memory = "shared-harvest", reason = "pair"}, {memory = "account-6", reason = "pair"}]
omitted = [{memory = "account-0", reason = "supersession"}, {memory = "account-1", reason = "supersession"}, {memory = "account-2", reason = "supersession"}, {memory = "account-3", reason = "supersession"}, {memory = "account-4", reason = "supersession"}, {memory = "account-5", reason = "supersession"}]
staleness = ["account-6"]
